name: Update source

on:
  schedule:
    - cron: "*/30 * * * *"   # check for a new taurus release every 30 minutes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Regenerate source.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 generate_source.py

      - name: Commit if it changed
        run: |
          git add source.json ipa-cache.json
          if git diff --cached --quiet; then
            echo "No new release."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update source to latest taurus release"
            git push
          fi
